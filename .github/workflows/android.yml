name: Build 3.75 Collection APK
on:
  push:
    paths:
      - 'SW375_android_min.zip'
      - 'mobile_v19.py'
      - 'mobile_v20.py'
      - 'catalog_v111.py'
      - 'catalog_v112.py'
      - 'catalog_v113.py'
      - 'catalog_v114.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o SW375_android_min.zip -d project

      - name: Fix CI Java path
        shell: bash
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' project/gradle.properties
          cat project/gradle.properties

      - name: Apply mobile v1.9 layout patch
        run: python3 mobile_v19.py

      - name: Apply tile gestures v1.10
        run: python3 mobile_v20.py

      - name: Apply catalog audit v1.11
        run: python3 catalog_v111.py

      - name: Apply catalog audit v1.12
        run: python3 catalog_v112.py

      - name: Apply vintage Kenner audit v1.13
        run: python3 catalog_v113.py

      - name: Apply POTF2 and Episode I audit v1.14
        run: python3 catalog_v114.py

      - name: Verify catalog consistency
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('project/app/src/main/assets/data.js').read_text(encoding='utf-8')
          data=json.loads(raw.split('=',1)[1].rstrip(';\n '))
          cats=data['categories']
          assert sum(len(v) for v in cats.values())==1221
          for c,items in cats.items():
              ids=[r['id'] for r in items]
              names=[r['entity'].casefold() for r in items]
              assert len(ids)==len(set(ids)),c
              assert len(names)==len(set(names)),c
          assert any(x['entity']=="Darth Vader’s Star Destroyer" for x in cats['playsets'])
          assert not any(x['entity']=="Darth Vader’s Star Destroyer" for x in cats['vehicles'])
          assert any(x['entity']=='Jann Tosh' for x in cats['figures'])
          assert any(x['entity']=='Rebel Transport' for x in cats['vehicles'])
          assert any(x['entity']=='R2-D2 Carry Case' for x in cats['accessories'])
          assert not any(x['entity']=='R2-D2 Carry Case' for x in cats['playsets'])
          assert any(x['entity']=="Figrin D'an" for x in cats['figures'])
          assert any(x['entity']=="POTF2 Millennium Falcon Gunner Station" for x in cats['playsets'])
          assert any(x['entity']=="Sith Accessory Set" for x in cats['accessories'])
          assert len([x for x in cats['accessories'] if x['entity']=="R2-D2 Carry Case"])==1
          print('Catalog OK:',{c:len(v) for c,v in cats.items()})
          PY

      - name: Validate JavaScript
        run: node --check project/app/src/main/assets/app.js

      - name: Install Gradle 8.7
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version

      - name: Build debug APK
        working-directory: project
        run: /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 375-Collection-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
