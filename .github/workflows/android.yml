name: Build 3.75 Collection APK
on:
  push:
    paths:
      - 'SW375_android_min.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o SW375_android_min.zip -d project

      - name: Fix CI Java path
        shell: bash
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' project/gradle.properties
          cat project/gradle.properties

      - name: Install Gradle 8.7
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version

      - name: Build debug APK
        working-directory: project
        run: /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 375-Collection-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
