name: Build desktop website
on:
  push:
    paths:
      - 'SW375_android_min.zip'
      - 'mobile_v19.py'
      - 'mobile_v20.py'
      - 'catalog_v*.py'
      - 'dashboard_v117.py'
      - 'browse_v117.py'
      - 'desktop_web_v118.py'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build current catalog and desktop app
        shell: bash
        run: |
          mkdir -p project
          unzip -q SW375_android_min.zip -d project
          python3 mobile_v19.py
          python3 mobile_v20.py
          for version in 111 112 113 114 115 116 117; do
            python3 "catalog_v${version}.py"
          done
          python3 dashboard_v117.py
          python3 browse_v117.py
          python3 desktop_web_v118.py

      - name: Verify PC site
        shell: bash
        run: |
          node --check project/app/src/main/assets/app.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('project/app/src/main/assets')
          html=(p/'index.html').read_text(encoding='utf-8')
          js=(p/'app.js').read_text(encoding='utf-8')
          data=json.loads((p/'data.js').read_text(encoding='utf-8').split('=',1)[1].rstrip(';\n '))
          assert sum(len(v) for v in data['categories'].values())==1257
          for x in ['desktopNav','desktopBackup','desktopWelcome','desktopSync','globalList','dashboard','batchBar']:
            assert 'id="'+x+'"' in html,x
          assert 'desktopNavV118' in js
          assert 'Ctrl+K' in html
          assert len(js)>60000
          print('Desktop web passed validation; 1257 catalog items')
          PY

      - name: Stage GitHub website
        shell: bash
        run: |
          mkdir -p web
          cp project/app/src/main/assets/{index.html,app.js,data.js,sw.js,manifest.json} web/
          touch web/.nojekyll
          mkdir -p docs
          cp web/{index.html,app.js,data.js,sw.js,manifest.json} docs/
          touch docs/.nojekyll
          cat > web/README.md <<'EOF'
          # 3.75 Collection – desktop web app

          Open index.html through a static HTTP server or GitHub Pages.
          The full 1,257-item catalog is included. Data is saved locally in your browser.
          Back up collection data using the built-in JSON export.
          Phone and PC can exchange backups or use the optional local sync server.

          Desktop shortcuts: Ctrl+K search, Ctrl+Shift+S backup, Ctrl+Shift+D dashboard.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: 375-Collection-PC-Web
          path: web/
          include-hidden-files: true
          if-no-files-found: error

      - name: Commit updated website to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/index.html web/app.js web/data.js web/sw.js web/manifest.json web/.nojekyll web/README.md
          git add -f docs/index.html docs/app.js docs/data.js docs/sw.js docs/manifest.json docs/.nojekyll
          if git diff --cached --quiet; then
            echo "Website already up to date."
          else
            git commit -m "Publish 3.75 Collection desktop website v1.18"
            git push origin HEAD:main
          fi
